name: Changelog Generator
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-gen
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore: update') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          mkdir -p data
          {
            echo "# Changelog"
            echo ""
            echo "Auto-generated from conventional commits."
            echo ""
            git log --no-merges --pretty=format:"### %ad%n%n%s%n%b" --date=format:"%Y-%m-%d" \
              | head -200
          } > CHANGELOG.md

      - name: Update last activity timestamp
        run: |
          mkdir -p data
          if [ -f data/stats.json ]; then
            TMP=$(mktemp)
            jq --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.last_commit = $date' data/stats.json > "$TMP"
            mv "$TMP" data/stats.json
          fi

      - name: Commit & push (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md data/stats.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: update changelog"
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin main; then
              if git push origin main; then ok=1; break; fi
            fi
            echo "retry $i failed, waiting..."
            sleep $((i * 8))
          done
          [ "$ok" = "1" ] || { echo "push failed after retries"; exit 1; }
