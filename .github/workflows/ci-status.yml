name: CI Status Tracker
on:
  workflow_run:
    workflows: [CI, "Deploy static content to Pages", "Stats Sync", "Activity Log"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ci-status-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update CI status
        run: |
          mkdir -p data
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          WORKFLOW="${{ github.event.workflow_run.name }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          STATUS="${{ github.event.workflow_run.status }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          jq -n \
            --arg workflow "$WORKFLOW" \
            --arg conclusion "$CONCLUSION" \
            --arg branch "$BRANCH" \
            --arg status "$STATUS" \
            --arg run_id "$RUN_ID" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{workflow: $workflow, conclusion: $conclusion, branch: $branch, status: $status, run_id: ($run_id|tonumber), date: $date}' \
            > data/ci-status.json

      - name: Commit & push (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ci-status.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: update CI status"
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase --autostash -X theirs origin main; then
              if git push origin main; then ok=1; break; fi
            else
              git rebase --abort 2>/dev/null || true
              git rebase --quit 2>/dev/null || true
              echo "rebase conflict; skipping (next trigger refreshes the file)"
              exit 0
            fi
            echo "retry $i failed, waiting..."
            sleep $((i * 8))
          done
          [ "$ok" = "1" ] || { echo "push failed after retries"; exit 1; }
