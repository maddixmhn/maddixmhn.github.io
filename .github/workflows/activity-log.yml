name: Activity Log
on:
  watch:
    types: [started]
  issues:
    types: [opened, closed, reopened]
  fork:

permissions:
  contents: write

concurrency:
  group: activity-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record activity
        run: |
          mkdir -p data
          if [ ! -f data/activity.json ]; then echo '[]' > data/activity.json; fi
          EVENT_TYPE=""
          ICON=""
          case "${{ github.event_name }}" in
            watch)
              EVENT_TYPE="star"
              ICON="⭐"
              MSG="${{ github.event.sender.login }} starred the repo"
              ;;
            issues)
              EVENT_TYPE="issue_${{ github.event.action }}"
              ICON="📋"
              MSG="${{ github.event.sender.login }} ${{ github.event.action }} issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
              ;;
            fork)
              EVENT_TYPE="fork"
              ICON="🔱"
              MSG="${{ github.event.sender.login }} forked the repo"
              ;;
          esac
          ENTRY=$(jq -n \
            --arg icon "$ICON" \
            --arg type "$EVENT_TYPE" \
            --arg msg "$MSG" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{icon: $icon, type: $type, message: $msg, date: $date}')
          TMP=$(mktemp)
          jq --argjson entry "$ENTRY" '[ $entry ] + .[0:49]' data/activity.json > "$TMP"
          mv "$TMP" data/activity.json

      - name: Commit & push (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: update activity log"
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase --autostash -X theirs origin main; then
              if git push origin main; then ok=1; break; fi
            else
              git rebase --abort 2>/dev/null || true
              git rebase --quit 2>/dev/null || true
              echo "rebase conflict; skipping (next trigger refreshes the file)"
              exit 0
            fi
            echo "retry $i failed, waiting..."
            sleep $((i * 8))
          done
          [ "$ok" = "1" ] || { echo "push failed after retries"; exit 1; }
