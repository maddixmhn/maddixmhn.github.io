<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1a2b"/>
      <stop offset="100%" stop-color="#1a2b45"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1ba5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="450" fill="url(#bg)"/>
  <rect width="640" height="450" fill="url(#bg)" opacity="0.4"/>

  <g transform="translate(0,0)">
    <circle cx="540" cy="80" r="180" fill="#1ba5ff" opacity="0.08"/>
    <circle cx="80" cy="380" r="220" fill="#7c3aed" opacity="0.07"/>
  </g>

  <g>
    <circle cx="40" cy="36" r="6" fill="#ff5f56"/>
    <circle cx="62" cy="36" r="6" fill="#ffbd2e"/>
    <circle cx="84" cy="36" r="6" fill="#27c93f"/>
    <rect x="120" y="28" width="360" height="16" rx="8" fill="#ffffff" opacity="0.1"/>
    <text x="300" y="40" font-family="monospace" font-size="11" fill="#8aa0b8" text-anchor="middle">iodeck.ir</text>
  </g>

  <rect x="40" y="80" width="160" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
  <rect x="40" y="104" width="260" height="10" rx="5" fill="#8aa0b8" opacity="0.5"/>

  <g>
    <rect x="40" y="150" width="18" height="10" rx="2" fill="#1ba5ff"/>
    <text x="70" y="160" font-family="monospace" font-size="13" fill="#8aa0b8">Home</text>
    <text x="130" y="160" font-family="monospace" font-size="13" fill="#8aa0b8">About</text>
    <text x="195" y="160" font-family="monospace" font-size="13" fill="#8aa0b8">Projects</text>
    <text x="280" y="160" font-family="monospace" font-size="13" fill="#8aa0b8">Contact</text>
    <rect x="520" y="146" width="80" height="28" rx="14" fill="url(#acc)"/>
  </g>

  <rect x="40" y="200" width="300" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
  <rect x="40" y="220" width="180" height="8" rx="4" fill="#ffffff" opacity="0.25"/>

  <g filter="url(#glow)">
    <rect x="40" y="260" width="140" height="90" rx="10" fill="url(#acc)" opacity="0.9"/>
    <rect x="200" y="260" width="140" height="90" rx="10" fill="#ffffff" opacity="0.08"/>
    <rect x="360" y="260" width="140" height="90" rx="10" fill="#ffffff" opacity="0.08"/>
  </g>

  <rect x="40" y="380" width="80" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="140" y="380" width="40" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
</svg>
